services:
  backend:
    build:
      context: .
      target: prod
    container_name: openshorts-backend
    expose:
      - "8000"
    volumes:
      - ./output:/app/output
      - ./uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: prod
    container_name: openshorts-frontend
    expose:
      - "80"
    environment:
      - VITE_PROXY_TARGET=http://backend:8000
      - VITE_RENDER_TARGET=http://renderer:3100
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    expose:
      - "3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend
